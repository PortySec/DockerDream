version: "3.8"

configs:
  haproxy_cfg:
    file: ./haproxy.cfg

secrets:
  haproxy_pem:
    external: true

services:
  nexus:
    image: sonatype/nexus3:3.71.0
    container_name: nexus
    volumes:
      - nexus-data:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs
      - NEXUS_CONTEXT=
    networks:
      - nexus-network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.zone == zone1 # Replace with your desired zone label
          - node.labels.server == server1 # Replace with your desired server label

  haproxy:
    image: haproxy:alpine
    container_name: haproxy
    ports:
      - "8081:8081" # HTTPS Nexus Web UI
      - "5000:5000" # HTTPS Docker Registry
    configs:
      - source: haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
    secrets:
      - haproxy_pem
    networks:
      - nexus-network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.zone == zone1 # Replace with your desired zone label
          - node.labels.server == server1 # Replace with your desired server label

volumes:
  nexus-data:
    driver: local

networks:
  nexus-network:
    driver: overlay
